[ShopBotM]
; How many good prefixes/suffixes (from goodPrefix_shopbotm.txt / goodSuffix_shopbotm.txt) an item
; needs before the shop command buys it. -1 means any affixes are fine. The chit command ignores these.
PrefixCount = 1
SuffixCount = 1

; Time between presses of the store's Refresh button, in milliseconds. The bot
; listens for the new stock for this long after each press, then buys.
RefreshCooldownMs = 250
